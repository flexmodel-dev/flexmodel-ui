# Flexmodel UI CI
# 可手动触发选择：只跑测试、只构建镜像、或两者都跑。
# push / PR 默认只跑测试（lint + 类型检查）。

name: Flexmodel UI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "执行测试（lint + 类型检查）"
        type: boolean
        default: true
      run_build:
        description: "执行构建并推送 Docker 镜像"
        type: boolean
        default: false

jobs:
  ui-test:
    name: UI tests (lint + type-check)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit

  push-ui-image:
    name: Push UI docker image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_build == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            cjbi/flexmodel-ui:latest
            cjbi/flexmodel-ui:${{ github.run_number }}
            cjbi/flexmodel-ui:${{ github.run_number }}-${{ github.sha }}
            cjbi/flexmodel-ui:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
